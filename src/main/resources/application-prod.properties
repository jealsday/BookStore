# ========================
# Production Configuration
# ========================

# ========================
# Database Configuration - PostgreSQL
# Construit l'URL JDBC a partir des variables Render
# ========================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookstore}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ========================
# JPA/Hibernate Configuration
# ========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ========================
# Logging Configuration
# ========================
logging.level.root=WARN
logging.level.bf.isge.gsn=INFO

# ========================
# Server Configuration
# ========================
server.port=${PORT:8080}

# ========================
# Security - Disable H2 Console in Production
# ========================
spring.h2.console.enabled=false
