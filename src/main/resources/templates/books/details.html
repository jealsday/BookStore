<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="fr">
<head th:replace="~{fragments/layout :: head('BookStore - ' + ${book.titre})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">

    <div class="row justify-content-center">
        <div class="col-lg-10">

            <!-- Back link -->
            <nav class="mb-3" style="font-size:0.85rem;">
                <a href="/books" style="color: var(--primary); text-decoration:none; font-weight:500;">
                    <i class="bi bi-arrow-left me-1"></i>Retour aux livres
                </a>
            </nav>

            <!-- Detail card -->
            <div class="card" style="overflow:hidden;">
                <div class="row g-0">
                    <!-- Cover Image -->
                    <div class="col-md-4">
                        <div class="book-detail-cover">
                            <img th:if="${book.couvertureUrl != null and !book.couvertureUrl.isEmpty()}"
                                 th:src="${book.couvertureUrl}"
                                 th:alt="${book.titre}"
                                 onerror="this.parentElement.innerHTML='<div class=\'cover-placeholder\'><i class=\'bi bi-book\'></i></div>'">
                            <div th:if="${book.couvertureUrl == null or book.couvertureUrl.isEmpty()}" class="cover-placeholder">
                                <i class="bi bi-book"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Book Info -->
                    <div class="col-md-8">
                        <div class="p-4">
                            <!-- Category badge -->
                            <div th:if="${book.categorie != null and !book.categorie.isEmpty()}" class="mb-2">
                                <span class="badge bg-primary-subtle text-primary" th:text="${book.categorie}">Categorie</span>
                            </div>

                            <!-- Title -->
                            <h1 style="font-size:1.75rem; font-weight:700; margin:0 0 0.5rem;" th:text="${book.titre}">Titre du livre</h1>

                            <!-- Author -->
                            <p style="font-size:1.1rem; color:var(--text-secondary); margin:0 0 1.5rem;">
                                par <strong th:text="${book.auteur}">Auteur</strong>
                            </p>

                            <!-- Price -->
                            <div class="mb-4">
                                <span class="book-detail-price" th:text="${#numbers.formatDecimal(book.prix, 0, 'COMMA', 0, 'POINT')} + ' CFA'">0 CFA</span>
                            </div>

                            <!-- Meta info -->
                            <div class="row g-3 mb-4">
                                <div class="col-6 col-sm-4">
                                    <div class="meta-item">
                                        <i class="bi bi-hash"></i>
                                        <div>
                                            <span class="meta-label">ID</span>
                                            <span class="meta-value" th:text="'#' + ${book.id}">#1</span>
                                        </div>
                                    </div>
                                </div>
                                <div th:if="${book.anneePublication != null}" class="col-6 col-sm-4">
                                    <div class="meta-item">
                                        <i class="bi bi-calendar3"></i>
                                        <div>
                                            <span class="meta-label">Annee</span>
                                            <span class="meta-value" th:text="${book.anneePublication}">2024</span>
                                        </div>
                                    </div>
                                </div>
                                <div th:if="${book.isbn != null and !book.isbn.isEmpty()}" class="col-6 col-sm-4">
                                    <div class="meta-item">
                                        <i class="bi bi-upc"></i>
                                        <div>
                                            <span class="meta-label">ISBN</span>
                                            <span class="meta-value" th:text="${book.isbn}">978-X-XX-XXXXX-X</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Description -->
                            <div th:if="${book.description != null and !book.description.isEmpty()}" class="mb-4">
                                <h3 style="font-size:0.9rem; font-weight:600; color:var(--text-light); margin:0 0 0.5rem;">Description</h3>
                                <p style="color:var(--text-secondary); line-height:1.6; margin:0;" th:text="${book.description}">
                                    Description du livre...
                                </p>
                            </div>

                            <!-- Actions -->
                            <div class="d-flex gap-2 flex-wrap">
                                <a href="/books" class="btn btn-ghost">
                                    <i class="bi bi-arrow-left me-1"></i>Retour
                                </a>
                                <a sec:authorize="hasRole('ADMIN')" th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-soft-warning">
                                    <i class="bi bi-pencil me-1"></i>Modifier
                                </a>
                                <a sec:authorize="hasRole('ADMIN')" th:href="@{/books/delete/{id}(id=${book.id})}"
                                   class="btn btn-soft-danger"
                                   onclick="return confirm('Voulez-vous vraiment supprimer ce livre ?');">
                                    <i class="bi bi-trash3 me-1"></i>Supprimer
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

<style>
.book-detail-cover {
    height: 100%;
    min-height: 400px;
    background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
}
.book-detail-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.book-detail-cover .cover-placeholder {
    color: rgba(255,255,255,0.5);
    font-size: 5rem;
}
.book-detail-price {
    display: inline-block;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--primary);
    background: var(--primary-light);
    padding: 8px 16px;
    border-radius: 8px;
}
.meta-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: var(--bg-secondary);
    border-radius: 8px;
}
.meta-item i {
    font-size: 1.2rem;
    color: var(--primary);
}
.meta-label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-light);
    font-weight: 600;
}
.meta-value {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text);
}
.bg-primary-subtle {
    background-color: var(--primary-light) !important;
}
.text-primary {
    color: var(--primary) !important;
}

@media (max-width: 767px) {
    .book-detail-cover {
        min-height: 300px;
    }
}
</style>

</body>
</html>
