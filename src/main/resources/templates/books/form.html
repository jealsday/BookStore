<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'BookStore - Modifier' : 'BookStore - Nouveau livre')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">

    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">

            <!-- Breadcrumb -->
            <nav class="mb-3" style="font-size:0.85rem;">
                <a href="/books" style="color: var(--primary); text-decoration:none; font-weight:500;">
                    <i class="bi bi-arrow-left me-1"></i>Retour aux livres
                </a>
            </nav>

            <!-- Form card -->
            <div class="card p-4">

                <!-- Header -->
                <div class="mb-4">
                    <h1 style="font-size:1.4rem; font-weight:700; margin:0;"
                        th:text="${isEdit} ? 'Modifier le livre' : 'Nouveau livre'">Titre</h1>
                    <p style="color: var(--text-secondary); font-size:0.875rem; margin:0.25rem 0 0;"
                       th:text="${isEdit} ? 'Modifiez les informations ci-dessous.' : 'Remplissez les informations du livre.'">
                        Description
                    </p>
                </div>

                <form th:action="@{/books/save}" th:object="${book}" method="post" novalidate>

                    <input type="hidden" th:if="${isEdit}" th:field="*{id}">

                    <div class="row">
                        <!-- Colonne gauche -->
                        <div class="col-md-6">
                            <!-- Titre -->
                            <div class="mb-3">
                                <label for="titre" class="form-label">Titre <span class="text-danger">*</span></label>
                                <input type="text" id="titre" th:field="*{titre}"
                                       class="form-control" th:classappend="${#fields.hasErrors('titre')} ? 'is-invalid'"
                                       placeholder="Ex : Le Parachutage">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('titre')}" th:errors="*{titre}">Erreur</div>
                            </div>

                            <!-- Auteur -->
                            <div class="mb-3">
                                <label for="auteur" class="form-label">Auteur <span class="text-danger">*</span></label>
                                <input type="text" id="auteur" th:field="*{auteur}"
                                       class="form-control" th:classappend="${#fields.hasErrors('auteur')} ? 'is-invalid'"
                                       placeholder="Ex : Norbert ZONGO">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('auteur')}" th:errors="*{auteur}">Erreur</div>
                            </div>

                            <!-- Prix -->
                            <div class="mb-3">
                                <label for="prix" class="form-label">Prix (CFA) <span class="text-danger">*</span></label>
                                <input type="number" id="prix" th:field="*{prix}" step="0.01" min="0.01" max="150000"
                                       class="form-control" th:classappend="${#fields.hasErrors('prix')} ? 'is-invalid'"
                                       placeholder="Ex : 10000">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('prix')}" th:errors="*{prix}">Erreur</div>
                            </div>

                            <!-- Categorie -->
                            <div class="mb-3">
                                <label for="categorie" class="form-label">Categorie</label>
                                <select id="categorie" th:field="*{categorie}" class="form-control">
                                    <option value="">-- Selectionnez --</option>
                                    <option value="Roman">Roman</option>
                                    <option value="Litterature africaine">Litterature africaine</option>
                                    <option value="Classique">Classique</option>
                                    <option value="Science-fiction">Science-fiction</option>
                                    <option value="Fantasy">Fantasy</option>
                                    <option value="Developpement personnel">Developpement personnel</option>
                                    <option value="Technologie">Technologie</option>
                                    <option value="Histoire">Histoire</option>
                                    <option value="Philosophie">Philosophie</option>
                                    <option value="Biographie">Biographie</option>
                                    <option value="Jeunesse">Jeunesse</option>
                                    <option value="Autre">Autre</option>
                                </select>
                            </div>
                        </div>

                        <!-- Colonne droite -->
                        <div class="col-md-6">
                            <!-- URL Couverture -->
                            <div class="mb-3">
                                <label for="couvertureUrl" class="form-label">URL de la couverture</label>
                                <input type="url" id="couvertureUrl" th:field="*{couvertureUrl}"
                                       class="form-control" th:classappend="${#fields.hasErrors('couvertureUrl')} ? 'is-invalid'"
                                       placeholder="https://exemple.com/image.jpg">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('couvertureUrl')}" th:errors="*{couvertureUrl}">Erreur</div>
                                <small class="text-muted">Collez l'URL d'une image de couverture</small>
                            </div>

                            <!-- Apercu de l'image -->
                            <div class="mb-3" id="coverPreviewContainer" style="display:none;">
                                <label class="form-label">Apercu</label>
                                <div style="width:120px; height:180px; border-radius:8px; overflow:hidden; border:1px solid var(--border-light);">
                                    <img id="coverPreview" src="" alt="Apercu" style="width:100%; height:100%; object-fit:cover;">
                                </div>
                            </div>

                            <!-- ISBN -->
                            <div class="mb-3">
                                <label for="isbn" class="form-label">ISBN</label>
                                <input type="text" id="isbn" th:field="*{isbn}"
                                       class="form-control" th:classappend="${#fields.hasErrors('isbn')} ? 'is-invalid'"
                                       placeholder="Ex : 978-2-07-036822-8">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}">Erreur</div>
                            </div>

                            <!-- Annee de publication -->
                            <div class="mb-3">
                                <label for="anneePublication" class="form-label">Annee de publication</label>
                                <input type="number" id="anneePublication" th:field="*{anneePublication}" min="1" max="2100"
                                       class="form-control" th:classappend="${#fields.hasErrors('anneePublication')} ? 'is-invalid'"
                                       placeholder="Ex : 1988">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('anneePublication')}" th:errors="*{anneePublication}">Erreur</div>
                            </div>
                        </div>
                    </div>

                    <!-- Description (pleine largeur) -->
                    <div class="mb-4">
                        <label for="description" class="form-label">Description</label>
                        <textarea id="description" th:field="*{description}" rows="4"
                                  class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                  placeholder="Resume ou description du livre..."></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Erreur</div>
                    </div>

                    <!-- Actions -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary-custom flex-grow-1">
                            <i th:if="${!isEdit}" class="bi bi-plus-lg me-1"></i>
                            <i th:if="${isEdit}" class="bi bi-check-lg me-1"></i>
                            <span th:text="${isEdit} ? 'Enregistrer' : 'Ajouter'">Sauvegarder</span>
                        </button>
                        <a href="/books" class="btn btn-ghost">Annuler</a>
                    </div>

                </form>
            </div>

        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

<script>
// Apercu de l'image de couverture
document.getElementById('couvertureUrl').addEventListener('input', function() {
    const url = this.value;
    const preview = document.getElementById('coverPreview');
    const container = document.getElementById('coverPreviewContainer');

    if (url && url.match(/^https?:\/\/.+\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i)) {
        preview.src = url;
        container.style.display = 'block';
        preview.onerror = function() {
            container.style.display = 'none';
        };
    } else if (url && url.startsWith('http')) {
        // Essayer quand meme pour les URLs sans extension
        preview.src = url;
        container.style.display = 'block';
        preview.onerror = function() {
            container.style.display = 'none';
        };
    } else {
        container.style.display = 'none';
    }
});

// Afficher l'apercu si une URL existe deja
window.addEventListener('load', function() {
    const urlInput = document.getElementById('couvertureUrl');
    if (urlInput.value) {
        urlInput.dispatchEvent(new Event('input'));
    }
});
</script>

</body>
</html>
