# Render Blueprint - Deployment Configuration
# https://render.com/docs/blueprint-spec

services:
  # Web Service - Spring Boot Application
  - type: web
    name: bookstore-api
    runtime: docker
    repo: https://github.com/jealsday/BookStore
    branch: master
    plan: free
    healthCheckPath: /login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: bookstore-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bookstore-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: bookstore-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: bookstore-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bookstore-db
          property: password
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx256m -Xms128m"

databases:
  # PostgreSQL Database
  - name: bookstore-db
    plan: free
    databaseName: bookstore
    user: bookstore_user
